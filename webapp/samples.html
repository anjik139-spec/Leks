<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LexKL · Образцы</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--s1:#6f8dff;--s2:#a9d2ff;--s3:#eef5ff;--ink:#151b38;--mut:#5a6390;--surf:#fff;--surf2:#f1f6ff;--line:#d8e4f8;--vio:#7c5cff;--mag:#ff4fa3;--amb:#ffab21;--mint:#12c98b;--red:#ff4d6d;--info:#22a7f0;--sh:0 14px 34px rgba(21,27,56,.13);--disp:'Unbounded',system-ui;--body:'Manrope',system-ui}
body[data-theme=night]{--s1:#080c2a;--s2:#1b2358;--s3:#333c72;--ink:#eaefff;--mut:#a3abd8;--surf:#161d43;--surf2:#1e2650;--line:#333d75}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:var(--body);color:var(--ink);min-height:100dvh;background:linear-gradient(178deg,var(--s1),var(--s2) 42%,var(--s3)) fixed}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 60px}
header{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:14px 2px;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--s1) 62%,transparent)}
h1{font:900 19px var(--disp);margin:0;flex:1}
.ib{width:40px;height:40px;border:0;border-radius:13px;background:var(--surf);color:var(--ink);cursor:pointer;box-shadow:var(--sh);font-size:16px}
.stats{display:flex;gap:9px;margin:14px 0}
.stat{flex:1;background:var(--surf);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.stat b{display:block;font:900 20px var(--disp)}.stat small{font:700 11px var(--body);color:var(--mut)}
.tools{background:var(--surf);border-radius:18px;padding:13px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.srow{display:flex;gap:8px;align-items:center;background:var(--surf2);border:2px solid var(--line);border-radius:14px;padding:4px 12px}
.srow:focus-within{border-color:var(--vio)}
.srow input{flex:1;border:0;outline:0;background:none;font:600 15px var(--body);color:var(--ink);padding:10px 0}
.seg{display:flex;background:var(--surf2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;cursor:pointer;border-radius:10px;padding:9px 4px;font:700 12.5px var(--body);background:none;color:var(--mut)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 3px 10px rgba(21,27,56,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}
.chips button{border:2px solid var(--line);background:var(--surf);color:var(--ink);border-radius:12px;padding:7px 12px;font:700 12px var(--body);cursor:pointer;white-space:nowrap}
.chips button.on{border-color:var(--vio);color:var(--vio);background:color-mix(in srgb,var(--vio) 12%,var(--surf))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.card{background:var(--surf);border-radius:18px;padding:15px;box-shadow:var(--sh);cursor:pointer;border:2px solid transparent;transition:.2s;animation:rise .45s backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--vio) 40%,transparent)}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;color:#fff;margin-bottom:10px}
.ic.doc{background:linear-gradient(135deg,var(--vio),var(--mag))}.ic.sheet{background:linear-gradient(135deg,var(--mint),var(--info))}.ic.file{background:linear-gradient(135deg,var(--amb),var(--mag))}
.card b{font:700 14.5px var(--body);display:block;margin-bottom:5px}
.card p{font:600 12.5px/1.45 var(--body);color:var(--mut);margin:0 0 9px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tags span{background:var(--surf2);border-radius:8px;padding:3px 8px;font:800 10px var(--body);color:var(--mut)}
.empty,.err{grid-column:1/-1;background:var(--surf);border-radius:18px;padding:34px;text-align:center;box-shadow:var(--sh)}
.empty h3,.err h3{font:700 17px var(--disp);margin:10px 0 6px}.empty p,.err p{font:600 13.5px var(--body);color:var(--mut);margin:0 0 14px}
.sk{background:var(--surf);border-radius:18px;padding:15px;box-shadow:var(--sh)}
.sk i{display:block;height:12px;border-radius:6px;background:linear-gradient(100deg,var(--surf2),var(--line),var(--surf2));background-size:220% 100%;animation:sh 1.3s linear infinite;margin-bottom:9px}
.sk i.b{height:44px;width:44px;border-radius:14px}.sk i.s{width:60%}
@keyframes sh{to{background-position:-220% 0}}
#scrim{position:fixed;inset:0;background:rgba(8,10,30,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:40}#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(720px,100%);max-height:92dvh;overflow:auto;background:var(--surf);border-radius:24px 24px 0 0;z-index:50;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,103%);transition:transform .4s cubic-bezier(.2,1,.3,1)}
.sheet.on{transform:translate(-50%,0)}
.handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sh{display:flex;gap:10px;align-items:center;margin-bottom:12px}.sh h2{font:700 17px var(--disp);margin:0;flex:1}
.prev{background:var(--surf2);border:2px solid var(--line);border-radius:14px;padding:13px;font:600 12.5px/1.6 var(--body);white-space:pre-wrap;max-height:240px;overflow:auto;margin-bottom:12px}
table.pv{width:100%;border-collapse:collapse;font:600 11.5px var(--body)}
table.pv th{background:var(--vio);color:#fff;padding:7px;text-align:left;position:sticky;top:0}
table.pv td{padding:6px 7px;border-bottom:1px solid var(--line)}
.tw{overflow:auto;max-height:230px;border-radius:12px;border:2px solid var(--line);margin-bottom:12px}
.lbl{font:800 10.5px var(--body);color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:13px 0 6px}
.inp,textarea{width:100%;border:2px solid var(--line);border-radius:12px;background:var(--surf2);color:var(--ink);font:600 13.5px/1.5 var(--body);padding:10px;outline:0}
.inp:focus,textarea:focus{border-color:var(--vio)}textarea{min-height:76px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;font:700 13px var(--body);margin:12px 0}
.sw{position:relative;width:46px;height:26px;border:0;border-radius:14px;background:var(--line);cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--mint)}.sw.on::after{left:23px}
.btn{width:100%;border:0;cursor:pointer;border-radius:15px;padding:13px;font:800 14px var(--body);color:#fff;background:linear-gradient(100deg,var(--vio),var(--mag));margin-top:9px}
.btn.ghost{background:var(--surf2);color:var(--ink)}.btn:disabled{opacity:.5}
.brow{display:flex;gap:8px;flex-wrap:wrap}.brow .btn{flex:1;min-width:130px}
.note{background:color-mix(in srgb,var(--amb) 18%,var(--surf));border-radius:13px;padding:11px;font:600 12px/1.5 var(--body);margin:12px 0}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
.toast{background:var(--ink);color:var(--s3);border-radius:14px;padding:12px 14px;font:700 13px var(--body);box-shadow:var(--sh);animation:pop .3s}
body[data-theme=night] .toast{background:var(--surf2);color:var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
footer{margin-top:24px;text-align:center;font:600 11.5px var(--body);color:var(--mut)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{border-radius:9px;background:linear-gradient(150deg,var(--vio),var(--mag))}
</style></head><body data-theme="day">
<div class="wrap">
<header><h1>📚 Образцы</h1><button class="ib" id="themeBtn">🌗</button><button class="ib" id="closeBtn">✕</button></header>
<div class="stats" id="stats"></div>
<div class="tools">
  <div class="srow">🔍<input id="q" placeholder="Поиск: договор, счёт, бюджет, табель…"></div>
  <div class="seg" id="types"><button data-t="all" class="on">Все</button><button data-t="doc">📄 Документы</button><button data-t="sheet">📊 Таблицы</button><button data-t="file">🗂 Файлы</button></div>
  <div class="chips" id="cats"></div>
</div>
<div class="grid" id="grid"></div>
<footer id="foot"></footer>
</div>
<div id="scrim"></div>
<section class="sheet" id="detail"><div class="handle"></div><div class="sh"><h2 id="dTitle"></h2><button class="ib" id="dClose">✕</button></div><div id="dBody"></div></section>
<div id="toasts"></div>
<script>
'use strict';(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const tg=window.Telegram&&Telegram.WebApp,inTG=!!(tg&&tg.initData);
if(inTG){tg.ready();tg.expand();try{tg.disableVerticalSwipes()}catch(e){}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hap=()=>{if(inTG)try{tg.HapticFeedback.impactOccurred('light')}catch(e){}};
let ITEMS=[],DISC='',UI={q:'',type:'all',cat:'Все'},cur=null,blank=false,busy=false;
let theme=localStorage.getItem('smp.theme')||'auto';
const eff=()=>theme==='auto'?((inTG&&tg.colorScheme==='dark')?'night':'day'):theme;
const applyTheme=()=>{document.body.dataset.theme=eff();localStorage.setItem('smp.theme',theme)};
applyTheme();if(inTG)tg.onEvent('themeChanged',applyTheme);
$('#themeBtn').onclick=()=>{theme=theme==='auto'?'day':theme==='day'?'night':'auto';applyTheme();toast('Тема: '+theme)};
$('#closeBtn').onclick=()=>inTG?tg.close():history.back();
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
async function api(p,b,idem){const h={'Content-Type':'application/json','X-Telegram-Init-Data':inTG?tg.initData:''};if(idem)h['Idempotency-Key']=idem;const r=await fetch(p,{method:b?'POST':'GET',headers:h,body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j}
const newIdem=()=>((crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random());
function skeleton(){$('#grid').innerHTML=Array.from({length:8},()=>'<div class="sk"><i class="b"></i><i></i><i class="s"></i></div>').join('')}
function cats(){const m=new Map();ITEMS.forEach(x=>m.set(x.cat,(m.get(x.cat)||0)+1));return[...m.entries()].sort((a,b)=>b[1]-a[1])}
function list(){const q=UI.q.toLowerCase().trim();return ITEMS.filter(x=>(UI.type==='all'||x.type===UI.type)&&(UI.cat==='Все'||x.cat===UI.cat)&&(!q||(x.title+' '+x.desc+' '+x.cat+' '+(x.preview||'')).toLowerCase().includes(q)))}
function render(){
  $('#stats').innerHTML=[['Документы',ITEMS.filter(x=>x.type==='doc').length],['Таблицы',ITEMS.filter(x=>x.type==='sheet').length],['Файлы',ITEMS.filter(x=>x.type==='file').length]]
    .map(s=>'<div class="stat"><b>'+s[1]+'</b><small>'+s[0]+'</small></div>').join('');
  $('#cats').innerHTML=[['Все',ITEMS.length]].concat(cats()).map(c=>'<button class="'+(UI.cat===c[0]?'on':'')+'" data-c="'+esc(c[0])+'">'+esc(c[0])+' '+c[1]+'</button>').join('');
  const L=list();
  $('#grid').innerHTML=L.length?L.map((x,i)=>'<article class="card" data-k="'+x.key+'" style="animation-delay:'+Math.min(i*20,360)+'ms"><div class="ic '+x.type+'">'+({doc:'📄',sheet:'📊',file:'🗂'})[x.type]+'</div><b>'+esc(x.title)+'</b><p>'+esc(x.desc)+'</p><div class="tags"><span>'+esc(x.cat)+'</span>'+x.formats.map(f=>'<span>'+f.toUpperCase()+'</span>').join('')+(x.formula_cols&&x.formula_cols.length?'<span>формулы</span>':'')+'</div></article>').join('')
   :'<div class="empty"><div style="font-size:42px">🔍</div><h3>Ничего не нашлось</h3><p>Попробуй другой запрос или сбрось фильтры.</p><button class="btn ghost" id="reset" style="max-width:240px;margin:0 auto">Сбросить</button></div>';
  const rb=$('#reset');if(rb)rb.onclick=()=>{UI={q:'',type:'all',cat:'Все'};$('#q').value='';$$('#types button').forEach(b=>b.classList.toggle('on',b.dataset.t==='all'));render()};
  $('#foot').textContent=DISC||'';
}
function open(k){
  cur=ITEMS.find(x=>x.key===k);if(!cur)return;blank=false;
  $('#dTitle').textContent=cur.title;
  let pv='';
  if(cur.preview_rows){pv='<div class="tw"><table class="pv"><tr>'+cur.preview_rows[0].map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+cur.preview_rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+esc(typeof c==='object'?'':c)+'</td>').join('')+'</tr>').join('')+'</table></div>'}
  else pv='<div class="prev">'+esc(cur.preview)+'</div>';
  const fields=cur.fields.length?'<div class="lbl">Поля документа</div>'+cur.fields.map(f=>'<div class="lbl" style="margin:9px 0 4px">'+esc(f.label)+'</div>'+(f.kind==='textarea'?'textarea':'input')+' class="inp" data-f="'+f.id+'" '+(f.kind==='textarea'?'':'type="text" ')+'value="'+esc(f.sample)+'"'+(f.kind==='textarea'?'></textarea>':'')+'>').join(''):'';
  const blankRow=cur.type==='doc'?'<div class="row"><span>Пустой бланк (без данных)</span><button class="sw" id="blankSw"></button></div>':'';
  const btns=cur.formats.map(f=>'<button class="btn" data-fmt="'+f+'">⬇️ '+f.toUpperCase()+'</button>').join('');
  $('#dBody').innerHTML='<p style="font:600 13px var(--body);color:var(--mut);margin:0 0 10px">'+esc(cur.desc)+'</p>'+pv+fields+blankRow+'<div class="brow">'+btns+'</div><button class="btn ghost" id="toChat">💬 Отправить в чат бота</button><div class="note">⚠️ '+esc(DISC)+'</div>';
  $('#scrim').classList.add('on');$('#detail').classList.add('on');
  if(inTG){try{tg.BackButton.show();tg.BackButton.onClick(close)}catch(e){}}
  const bs=$('#blankSw');if(bs)bs.onclick=()=>{blank=!blank;bs.classList.toggle('on',blank)};
  $('#toChat').onclick=()=>{if(inTG){try{tg.sendData(JSON.stringify({action:'template',key:cur.key}));return}catch(e){}}toast('В чате: /sample '+cur.key)};
  $$('#dBody [data-fmt]').forEach(b=>b.onclick=()=>make(b.dataset.fmt,b));
}
function close(){$('#detail').classList.remove('on');$('#scrim').classList.remove('on');if(inTG){try{tg.BackButton.hide();tg.BackButton.offClick(close)}catch(e){}}}
$('#dClose').onclick=close;$('#scrim').onclick=close;
async function make(fmt,btn){
  if(busy)return;busy=true;btn.disabled=true;const old=btn.textContent;btn.textContent='Собираю…';
  const fields={};$$('#dBody [data-f]').forEach(i=>fields[i.dataset.f]=i.value);
  try{
    const r=await api('/api/template',{key:cur.key,fmt,blank,fields},newIdem());
    const a=document.createElement('a');a.href=r.url;a.download=r.name;document.body.appendChild(a);a.click();a.remove();
    toast('Готово: '+r.name+' · '+Math.round(r.size/1024)+' КБ');hap();
  }catch(e){toast(e.code==='rate'?'Слишком часто, подожди минуту':'Не собралось: '+(e.code||'сеть'))}
  btn.disabled=false;btn.textContent=old;busy=false;
}
$('#q').oninput=e=>{UI.q=e.target.value;render()};
$('#types').onclick=e=>{const b=e.target.closest('[data-t]');if(b){UI.type=b.dataset.t;$$('#types button').forEach(x=>x.classList.toggle('on',x===b));render();hap()}};
$('#cats').onclick=e=>{const b=e.target.closest('[data-c]');if(b){UI.cat=b.dataset.c;render();hap()}};
$('#grid').onclick=e=>{const c=e.target.closest('[data-k]');if(c){hap();open(c.dataset.k)}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='/'){e.preventDefault();$('#q').focus()}});
(async function boot(){
  skeleton();
  if(!inTG){$('#grid').innerHTML='<div class="err"><div style="font-size:42px">👻</div><h3>Открой внутри Telegram</h3><p>Каталог и генерация файлов работают через сервер бота с проверкой initData.</p><button class="btn ghost" id="retry" style="max-width:220px;margin:0 auto">Повторить</button></div>';$('#retry').onclick=boot;return}
  try{const r=await api('/api/templates');ITEMS=r.items;DISC=r.disclaimer;render();
    const sp=(tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||new URLSearchParams(location.search).get('startapp')||'';if(sp&&sp.startsWith('tpl_'))open(sp.slice(4));
  }catch(e){$('#grid').innerHTML='<div class="err"><div style="font-size:42px">📡</div><h3>Сервер недоступен</h3><p>Проверь, что запущен контейнер web и адрес открыт по HTTPS.</p><button class="btn" id="retry" style="max-width:220px;margin:0 auto">Повторить</button></div>';$('#retry').onclick=boot}
})();
})();
</script></body></html>
